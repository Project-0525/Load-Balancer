<!DOCTYPE html>
<html>
<head>
  <title>Load Balancer Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    .metrics { margin-top: 20px; }
    table { border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>
  <h1>📊 Load Balancer Metrics Dashboard</h1>
  <div class="metrics">
    <p><strong>Total Requests:</strong> <span id="totalRequests">0</span></p>
    <table>
      <thead>
        <tr>
          <th>Node</th>
          <th>Requests</th>
        </tr>
      </thead>
      <tbody id="nodeMetrics"></tbody>
    </table>
  </div>

  <script>
    async function fetchMetrics() {
      const response = await fetch("/metrics");
      const data = await response.json();

      document.getElementById("totalRequests").textContent = data.requests;

      const tbody = document.getElementById("nodeMetrics");
      tbody.innerHTML = "";
      for (const [node, count] of Object.entries(data.perNode)) {
        const row = `<tr><td>${node}</td><td>${count}</td></tr>`;
        tbody.innerHTML += row;
      }
    }

    // Refresh metrics every 2 seconds
    setInterval(fetchMetrics, 2000);
    fetchMetrics();
  </script>
</body>
</html>
